name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tower_defense
          POSTGRES_USER: tower_defense
          POSTGRES_PASSWORD: tower_defense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tower_defense -d tower_defense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      PUBLIC_URL: http://127.0.0.1:3001
      DATABASE_URL: postgresql://tower_defense:tower_defense@127.0.0.1:5432/tower_defense
      TEST_DATABASE_URL: postgresql://tower_defense:tower_defense@127.0.0.1:5432/tower_defense
      BETTER_AUTH_SECRET: ci-secret-that-is-at-least-thirty-two-characters
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      EMAIL_FROM: CI <ci@example.test>
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm report:balance > /dev/null
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: docker build --tag dubious-realm:ci .
